<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETROLOG-PRO // Well Log Evaluator</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- React, ReactDOM, and Babel CDNs -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- INLINE SVG ICONS ---
    const IconActivity = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M22 12h-4l-3 9L9 3l-3 9H2" />
      </svg>
    );

    const IconSliders = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
      </svg>
    );

    const IconFilter = ({ className = "w-4 h-4" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
      </svg>
    );

    const IconRefresh = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
    );

    const IconDownload = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
    );

    const IconPlus = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
      </svg>
    );

    const IconCode = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
      </svg>
    );

    // --- PHYSICAL BOUNDS & SANITIZATION ---
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

    const sanitizeRow = (r) => {
      const depth = isNaN(r.depth) ? 2000 : parseFloat(r.depth);
      const gr = clamp(isNaN(r.gr) ? 60 : parseFloat(r.gr), 0, 300);
      const res = clamp(isNaN(r.res) ? 10 : parseFloat(r.res), 0.1, 5000);
      const rhob = clamp(isNaN(r.rhob) ? 2.35 : parseFloat(r.rhob), 1.0, 3.5);
      const nphi = clamp(isNaN(r.nphi) ? 0.20 : parseFloat(r.nphi), -0.05, 0.60);
      const cali = clamp(isNaN(r.cali) ? 8.5 : parseFloat(r.cali), 4.0, 24.0);
      return { depth, gr, res, rhob, nphi, cali };
    };

    // --- CLIENT-SIDE LAS 2.0 PARSER ---
    const parseLASContent = (lasText) => {
      const lines = lasText.split(/\r?\n/);
      let isDataSection = false;
      const curveNames = [];
      let nullValue = -999.25;
      const parsedData = [];

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed.toUpperCase().startsWith('NULL.')) {
          const match = trimmed.match(/NULL\.\s+([-\d.]+)/i);
          if (match) nullValue = parseFloat(match[1]);
        }

        if (trimmed.toUpperCase().startsWith('~C')) {
          isDataSection = false;
          continue;
        }

        if (trimmed.toUpperCase().startsWith('~A')) {
          isDataSection = true;
          continue;
        }

        if (!isDataSection && trimmed.includes(':')) {
          const mnemonic = trimmed.split(/[\.\s]/)[0].toUpperCase();
          if (mnemonic) curveNames.push(mnemonic);
        }

        if (isDataSection) {
          const values = trimmed.split(/\s+/).map((v) => parseFloat(v));
          if (values.length < curveNames.length) continue;

          const rowMap = {};
          curveNames.forEach((name, idx) => {
            rowMap[name] = values[idx];
          });

          const depth = rowMap['DEPT'] ?? rowMap['DEPTH'] ?? values[0];
          const gr = rowMap['GR'] ?? rowMap['CGR'] ?? rowMap['GAM'] ?? 60;
          const res = rowMap['RES'] ?? rowMap['ILD'] ?? rowMap['LLD'] ?? rowMap['RT'] ?? rowMap['AT90'] ?? 10;
          const rhob = rowMap['RHOB'] ?? rowMap['DEN'] ?? rowMap['RHOZ'] ?? 2.35;
          const nphi = rowMap['NPHI'] ?? rowMap['TNPH'] ?? rowMap['NPOR'] ?? 0.20;
          const cali = rowMap['CALI'] ?? rowMap['CAL'] ?? 8.5;

          if (depth !== nullValue && !isNaN(depth)) {
            parsedData.push(
              sanitizeRow({
                depth,
                gr: gr === nullValue ? 60 : gr,
                res: res === nullValue ? 2.0 : res,
                rhob: rhob === nullValue ? 2.35 : rhob,
                nphi: nphi === nullValue ? 0.20 : nphi,
                cali: cali === nullValue ? 8.5 : cali,
              })
            );
          }
        }
      }
      return parsedData.sort((a, b) => a.depth - b.depth);
    };

    // --- SYNTHETIC LOG GENERATOR ---
    const generateSyntheticLogData = () => {
      const data = [];
      for (let d = 2050; d <= 2150; d += 0.5) {
        let gr, res, rhob, nphi, cali;
        if (d < 2070) {
          gr = 95 + Math.sin(d * 0.8) * 15 + Math.random() * 8;
          res = 2.0 + Math.random() * 0.8;
          rhob = 2.55 + Math.random() * 0.08;
          nphi = 0.38 + Math.random() * 0.04;
          cali = 9.2 + Math.random() * 0.3;
        } else if (d < 2095) {
          gr = 25 + Math.sin(d * 0.3) * 8 + Math.random() * 5;
          res = 85 + Math.cos(d * 0.2) * 25 + Math.random() * 15;
          rhob = 2.18 + Math.random() * 0.05;
          nphi = 0.12 + Math.random() * 0.03;
          cali = 8.5 + Math.random() * 0.1;
        } else if (d < 2118) {
          gr = 32 + Math.sin(d * 0.5) * 10 + Math.random() * 6;
          res = 35 + Math.cos(d * 0.4) * 10 + Math.random() * 8;
          rhob = 2.28 + Math.random() * 0.06;
          nphi = 0.22 + Math.random() * 0.03;
          cali = 8.5 + Math.random() * 0.1;
        } else if (d < 2135) {
          gr = 28 + Math.sin(d * 0.4) * 7 + Math.random() * 5;
          res = 1.2 + Math.random() * 0.5;
          rhob = 2.34 + Math.random() * 0.05;
          nphi = 0.26 + Math.random() * 0.03;
          cali = 8.5 + Math.random() * 0.1;
        } else {
          gr = 110 + Math.cos(d * 0.6) * 18 + Math.random() * 8;
          res = 2.5 + Math.random() * 0.6;
          rhob = 2.58 + Math.random() * 0.06;
          nphi = 0.40 + Math.random() * 0.04;
          cali = 9.0 + Math.random() * 0.2;
        }
        data.push(sanitizeRow({ depth: d, gr, res, rhob, nphi, cali }));
      }
      return data;
    };

    function App() {
      const [theme, setTheme] = useState('slate');
      const [rawData, setRawData] = useState(() => generateSyntheticLogData());
      const [hoveredIndex, setHoveredIndex] = useState(null);

      // Petrophysical & Archie Parameters
      const [rw, setRw] = useState(0.045);
      const [a, setA] = useState(1.0);
      const [m, setM] = useState(2.0);
      const [n, setN] = useState(2.0);
      const [rhoMatrix, setRhoMatrix] = useState(2.65);
      const [rhoFluid, setRhoFluid] = useState(1.0);

      // Cutoffs
      const [vshCutoff, setVshCutoff] = useState(0.35);
      const [phiCutoff, setPhiCutoff] = useState(0.10);
      const [swCutoff, setSwCutoff] = useState(0.50);

      const [grClean, setGrClean] = useState(20);
      const [grShale, setGrShale] = useState(120);

      // Modal & Editor States
      const [showAddPointModal, setShowAddPointModal] = useState(false);
      const [showManualEditor, setShowManualEditor] = useState(false);
      const [manualText, setManualText] = useState('');
      const [customPoint, setCustomPoint] = useState({
        depth: 2090.0,
        gr: 30.0,
        res: 45.0,
        rhob: 2.25,
        nphi: 0.18,
        cali: 8.5
      });

      // Dynamic Themes
      const themeStyles = useMemo(() => {
        if (theme === 'light') {
          return {
            appBg: 'bg-zinc-100 text-zinc-900',
            cardBg: 'bg-white border-zinc-200 shadow-sm',
            trackBg: '#ffffff',
            gridLine: '#e4e4e7',
            border: 'border-zinc-200',
            subText: 'text-zinc-500',
            inputBg: 'bg-zinc-50 border-zinc-300 text-zinc-900',
            accentTrack: '#0284c7'
          };
        }
        if (theme === 'obsidian') {
          return {
            appBg: 'bg-black text-neutral-100',
            cardBg: 'bg-neutral-950 border-neutral-800',
            trackBg: '#000000',
            gridLine: '#262626',
            border: 'border-neutral-800',
            subText: 'text-neutral-400',
            inputBg: 'bg-neutral-900 border-neutral-800 text-neutral-100',
            accentTrack: '#38bdf8'
          };
        }
        return {
          appBg: 'bg-slate-950 text-slate-100',
          cardBg: 'bg-slate-900/80 border-slate-800',
          trackBg: '#020617',
          gridLine: '#1e293b',
          border: 'border-slate-800',
          subText: 'text-slate-400',
          inputBg: 'bg-slate-950 border-slate-800 text-slate-100',
          accentTrack: '#38bdf8'
        };
      }, [theme]);

      // Petrophysical Calculations
      const computedLogs = useMemo(() => {
        const sorted = [...rawData].sort((a, b) => a.depth - b.depth);
        return sorted.map((row) => {
          const denom = Math.max(1, grShale - grClean);
          let vsh = clamp((row.gr - grClean) / denom, 0.0, 1.0);

          const rhoDenom = Math.max(0.1, rhoMatrix - rhoFluid);
          let phiD = clamp((rhoMatrix - row.rhob) / rhoDenom, 0.0, 0.50);
          const phiE = clamp(phiD * (1 - vsh), 0.001, 0.50);

          const f = (a * rw) / (Math.pow(phiE, m) * Math.max(0.1, row.res));
          let sw = clamp(Math.pow(Math.max(0, f), 1 / Math.max(0.1, n)), 0.01, 1.0);

          const isReservoir = vsh <= vshCutoff && phiE >= phiCutoff;
          const isPay = isReservoir && sw <= swCutoff;

          return { ...row, vsh, phiE, sw, isReservoir, isPay };
        });
      }, [rawData, rw, a, m, n, rhoMatrix, rhoFluid, vshCutoff, phiCutoff, swCutoff, grClean, grShale]);

      // Summary KPIs
      const metrics = useMemo(() => {
        const total = computedLogs.length;
        if (total === 0) return { gross: '0.0', netRes: '0.0', netPay: '0.0', ntg: '0.0', avgPhi: '0.0', avgSw: '0.0', avgShc: '0.0' };

        const minD = computedLogs[0].depth;
        const maxD = computedLogs[total - 1].depth;
        const grossInterval = Math.max(1, maxD - minD);

        const paySamples = computedLogs.filter((d) => d.isPay);
        const resSamples = computedLogs.filter((d) => d.isReservoir);

        const avgStep = total > 1 ? grossInterval / (total - 1) : 0.5;
        const netPayThickness = paySamples.length * avgStep;
        const netResThickness = resSamples.length * avgStep;
        const ntg = (netPayThickness / grossInterval) * 100;

        const avgPhi = paySamples.length ? (paySamples.reduce((acc, cur) => acc + cur.phiE, 0) / paySamples.length) * 100 : 0;
        const avgSw = paySamples.length ? (paySamples.reduce((acc, cur) => acc + cur.sw, 0) / paySamples.length) * 100 : 0;

        return {
          gross: grossInterval.toFixed(1),
          netRes: netResThickness.toFixed(1),
          netPay: netPayThickness.toFixed(1),
          ntg: clamp(ntg, 0, 100).toFixed(1),
          avgPhi: clamp(avgPhi, 0, 100).toFixed(1),
          avgSw: clamp(avgSw, 0, 100).toFixed(1),
          avgShc: clamp(100 - avgSw, 0, 100).toFixed(1)
        };
      }, [computedLogs]);

      const minDepth = computedLogs[0]?.depth ?? 2050;
      const maxDepth = computedLogs[computedLogs.length - 1]?.depth ?? 2150;
      const trackHeight = 650;
      const trackWidth = 140;

      const depthToY = (depth) => {
        if (maxDepth === minDepth) return 0;
        return ((depth - minDepth) / (maxDepth - minDepth)) * trackHeight;
      };

      // Handle Native LAS File Upload
      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const text = event.target.result;
          const parsed = parseLASContent(text);
          if (parsed.length > 0) {
            setRawData(parsed);
          } else {
            alert("Could not extract curves. Ensure this is a valid .LAS (v2.0) file.");
          }
        };
        reader.readAsText(file);
      };

      // Handle Adding Custom Point
      const handleAddPoint = (e) => {
        e.preventDefault();
        const cleaned = sanitizeRow(customPoint);
        setRawData((prev) => {
          const filtered = prev.filter((p) => p.depth !== cleaned.depth);
          return [...filtered, cleaned].sort((a, b) => a.depth - b.depth);
        });
        setShowAddPointModal(false);
      };

      // Handle Manual Editor
      const handleOpenManualEditor = () => {
        const text = computedLogs
          .map((r) => `${r.depth}\t${r.gr.toFixed(1)}\t${r.res.toFixed(1)}\t${r.rhob.toFixed(2)}\t${r.nphi.toFixed(2)}\t${r.cali.toFixed(1)}`)
          .join('\n');
        setManualText(text);
        setShowManualEditor(true);
      };

      const handleApplyManualData = () => {
        try {
          const lines = manualText.trim().split('\n');
          const parsed = [];

          for (let line of lines) {
            const clean = line.trim();
            if (!clean || clean.startsWith('#') || clean.toLowerCase().startsWith('depth')) continue;
            
            const parts = clean.includes('\t') ? clean.split('\t') : clean.split(',');
            if (parts.length >= 4) {
              parsed.push(
                sanitizeRow({
                  depth: parseFloat(parts[0]),
                  gr: parseFloat(parts[1]),
                  res: parseFloat(parts[2]),
                  rhob: parseFloat(parts[3]),
                  nphi: parts[4] ? parseFloat(parts[4]) : 0.15,
                  cali: parts[5] ? parseFloat(parts[5]) : 8.5
                })
              );
            }
          }

          if (parsed.length > 0) {
            setRawData(parsed.sort((a, b) => a.depth - b.depth));
            setShowManualEditor(false);
          } else {
            alert('Could not parse valid rows. Format: Depth, GR, RES, RHOB, NPHI.');
          }
        } catch (err) {
          alert('Error parsing data: ' + err.message);
        }
      };

      // Export CSV
      const handleExportCSV = () => {
        const headers = 'Depth_m,GR_API,CALI_in,RES_ohmm,RHOB_gcc,NPHI_dec,VSH_dec,PHIE_dec,Sw_dec,IsPay\n';
        const rows = computedLogs
          .map(
            (r) =>
              `${r.depth},${r.gr.toFixed(2)},${r.cali.toFixed(2)},${r.res.toFixed(2)},${r.rhob.toFixed(2)},${r.nphi.toFixed(2)},${r.vsh.toFixed(3)},${r.phiE.toFixed(3)},${r.sw.toFixed(3)},${r.isPay ? 1 : 0}`
          )
          .join('\n');

        const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `WellLog_Evaluation_${Date.now()}.csv`;
        link.click();
      };

      const currentHoveredData = hoveredIndex !== null ? computedLogs[hoveredIndex] : null;

      return (
        <div className={`min-h-screen ${themeStyles.appBg} p-4 md:p-6 transition-colors duration-200`}>
          {/* Header */}
          <header className={`flex flex-wrap items-center justify-between border-b ${themeStyles.border} pb-4 mb-6 gap-4`}>
            <div>
              <div className="flex items-center gap-2">
                <IconActivity className="h-6 w-6 text-emerald-400" />
                <h1 className="text-xl md:text-2xl font-bold font-mono tracking-tight bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 bg-clip-text text-transparent">
                  PETROLOG-PRO // Well Log Evaluator
                </h1>
              </div>
              <p className={`text-xs ${themeStyles.subText} mt-1 font-mono`}>
                Interval: {minDepth.toFixed(1)}m – {maxDepth.toFixed(1)}m | Shaly-Sand Archie Pipeline
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              {/* Theme Toggle */}
              <div className="flex rounded border border-slate-700/50 p-0.5 bg-slate-900/40 text-xs mr-2">
                {['slate', 'obsidian', 'light'].map((t) => (
                  <button
                    key={t}
                    onClick={() => setTheme(t)}
                    className={`px-2 py-1 rounded uppercase font-mono text-[10px] ${theme === t ? 'bg-slate-700 text-white font-bold' : 'text-slate-400'}`}
                  >
                    {t}
                  </button>
                ))}
              </div>

              {/* Action Buttons */}
              <label className="flex items-center gap-1.5 bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-3 py-1.5 rounded text-xs cursor-pointer shadow-sm">
                <span>📁 Upload .LAS</span>
                <input type="file" accept=".las,.txt" onChange={handleFileUpload} className="hidden" />
              </label>

              <button
                onClick={() => setShowAddPointModal(true)}
                className="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-semibold"
              >
                <IconPlus className="h-3.5 w-3.5" /> Add Point
              </button>

              <button
                onClick={handleOpenManualEditor}
                className="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600/50 px-3 py-1.5 rounded text-xs font-semibold"
              >
                <IconCode className="h-3.5 w-3.5 text-cyan-400" /> Advanced Editor
              </button>

              <button
                onClick={() => setRawData(generateSyntheticLogData())}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600/50 px-3 py-1.5 rounded text-xs font-mono"
              >
                <IconRefresh className="h-3.5 w-3.5 inline mr-1" /> Re-seed
              </button>

              <button
                onClick={handleExportCSV}
                className="flex items-center gap-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded text-xs shadow-sm"
              >
                <IconDownload className="h-3.5 w-3.5" /> Save CSV
              </button>
            </div>
          </header>

          {/* Top KPI Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6 font-mono">
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Net Pay</p>
              <p className="text-2xl font-bold text-emerald-400">{metrics.netPay}m</p>
            </div>
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Net-to-Gross</p>
              <p className="text-2xl font-bold text-cyan-400">{metrics.ntg}%</p>
            </div>
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Net Reservoir</p>
              <p className="text-2xl font-bold text-slate-200">{metrics.netRes}m</p>
            </div>
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Avg Φe (Pay)</p>
              <p className="text-2xl font-bold text-amber-400">{metrics.avgPhi}%</p>
            </div>
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Avg Sw (Pay)</p>
              <p className="text-2xl font-bold text-sky-400">{metrics.avgSw}%</p>
            </div>
            <div className={`${themeStyles.cardBg} p-3 rounded-lg border`}>
              <p className={`text-[10px] uppercase ${themeStyles.subText}`}>Avg Hydrocarbon</p>
              <p className="text-2xl font-bold text-orange-400">{metrics.avgShc}%</p>
            </div>
          </div>

          {/* Control Panels & Multi-Track Display */}
          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Controls Left Column */}
            <div className="lg:col-span-4 flex flex-col gap-4">
              {/* Archie Controls */}
              <div className={`${themeStyles.cardBg} rounded-lg p-4 border space-y-3 font-mono text-xs`}>
                <div className="flex items-center gap-1.5 text-emerald-400 border-b border-slate-700/50 pb-2">
                  <IconSliders className="h-4 w-4" />
                  <h2 className="font-bold uppercase tracking-wide">Archie & Matrix</h2>
                </div>
                
                <div>
                  <label className={themeStyles.subText}>Matrix Lithology</label>
                  <div className="grid grid-cols-3 gap-2 mt-1">
                    {[
                      { label: 'Sandstone', val: 2.65 },
                      { label: 'Limestone', val: 2.71 },
                      { label: 'Dolomite', val: 2.87 }
                    ].map((item) => (
                      <button
                        key={item.label}
                        onClick={() => setRhoMatrix(item.val)}
                        className={`p-1.5 rounded border ${rhoMatrix === item.val ? 'border-emerald-500 bg-emerald-500/10 text-emerald-400 font-bold' : 'border-slate-800'}`}
                      >
                        {item.label}
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="flex justify-between"><span>Rw:</span><span className="text-cyan-400 font-bold">{rw.toFixed(3)} Ω·m</span></div>
                  <input type="range" min="0.01" max="0.25" step="0.005" value={rw} onChange={(e) => setRw(parseFloat(e.target.value))} className="w-full accent-cyan-400" />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <div className="flex justify-between"><span>m:</span><span className="text-cyan-400 font-bold">{m.toFixed(2)}</span></div>
                    <input type="range" min="1.4" max="2.6" step="0.05" value={m} onChange={(e) => setM(parseFloat(e.target.value))} className="w-full accent-cyan-400" />
                  </div>
                  <div>
                    <div className="flex justify-between"><span>n:</span><span className="text-cyan-400 font-bold">{n.toFixed(2)}</span></div>
                    <input type="range" min="1.4" max="2.6" step="0.05" value={n} onChange={(e) => setN(parseFloat(e.target.value))} className="w-full accent-cyan-400" />
                  </div>
                </div>
              </div>

              {/* Cutoffs Controls */}
              <div className={`${themeStyles.cardBg} rounded-lg p-4 border space-y-3 font-mono text-xs`}>
                <div className="flex items-center gap-1.5 text-amber-400 border-b border-slate-700/50 pb-2">
                  <IconFilter className="h-4 w-4" />
                  <h2 className="font-bold uppercase tracking-wide">Reservoir Cutoffs</h2>
                </div>
                <div>
                  <div className="flex justify-between"><span>Max Vsh:</span><span className="text-amber-400 font-bold">{(vshCutoff * 100).toFixed(0)}%</span></div>
                  <input type="range" min="0.10" max="0.60" step="0.01" value={vshCutoff} onChange={(e) => setVshCutoff(parseFloat(e.target.value))} className="w-full accent-amber-400" />
                </div>
                <div>
                  <div className="flex justify-between"><span>Min Φe:</span><span className="text-amber-400 font-bold">{(phiCutoff * 100).toFixed(0)}%</span></div>
                  <input type="range" min="0.03" max="0.25" step="0.01" value={phiCutoff} onChange={(e) => setPhiCutoff(parseFloat(e.target.value))} className="w-full accent-amber-400" />
                </div>
                <div>
                  <div className="flex justify-between"><span>Max Sw:</span><span className="text-amber-400 font-bold">{(swCutoff * 100).toFixed(0)}%</span></div>
                  <input type="range" min="0.20" max="0.80" step="0.02" value={swCutoff} onChange={(e) => setSwCutoff(parseFloat(e.target.value))} className="w-full accent-amber-400" />
                </div>
              </div>

              {/* Inspection Readout */}
              <div className={`${themeStyles.cardBg} rounded-lg p-4 border flex-1`}>
                <h3 className={`text-xs font-bold font-mono ${themeStyles.subText} uppercase tracking-wider mb-2`}>Depth Inspection</h3>
                {currentHoveredData ? (
                  <div className="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>DEPTH</span>
                      <span className="font-bold">{currentHoveredData.depth.toFixed(1)}m</span>
                    </div>
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>PAY STATUS</span>
                      <span className={currentHoveredData.isPay ? "text-emerald-400 font-bold" : "text-slate-500"}>
                        {currentHoveredData.isPay ? "PAY ZONE" : "NON-PAY"}
                      </span>
                    </div>
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>GAMMA RAY</span>
                      <span className="text-emerald-400">{currentHoveredData.gr.toFixed(1)} API</span>
                    </div>
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>RESISTIVITY</span>
                      <span className="text-orange-400">{currentHoveredData.res.toFixed(1)} Ω·m</span>
                    </div>
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>POROSITY (Φe)</span>
                      <span className="text-amber-400">{(currentHoveredData.phiE * 100).toFixed(1)}%</span>
                    </div>
                    <div className={`${themeStyles.inputBg} p-2 rounded border`}>
                      <span className={`block text-[10px] ${themeStyles.subText}`}>WATER SAT (Sw)</span>
                      <span className="text-cyan-400">{(currentHoveredData.sw * 100).toFixed(1)}%</span>
                    </div>
                  </div>
                ) : (
                  <p className={`text-xs ${themeStyles.subText} italic py-4 text-center font-mono`}>Hover over log tracks to inspect continuous readings.</p>
                )}
              </div>
            </div>

            {/* Right Multi-Track Display */}
            <div className={`lg:col-span-8 ${themeStyles.cardBg} rounded-lg p-4 border flex flex-col items-center overflow-x-auto`}>
              <div className="relative border border-slate-800 rounded p-3 select-none min-w-[700px]" style={{ backgroundColor: themeStyles.trackBg }}>
                <div className="grid grid-cols-12 text-[10px] font-mono font-bold text-slate-400 mb-2 border-b border-slate-800 pb-1 text-center">
                  <div className="col-span-1">DEPTH</div>
                  <div className="col-span-3 text-emerald-400">TRACK 1: GR (0-150 API)</div>
                  <div className="col-span-3 text-orange-400">TRACK 2: RES (0.2-2000 Ω·m)</div>
                  <div className="col-span-3 text-red-400">TRACK 3: NPHI/RHOB</div>
                  <div className="col-span-2 text-cyan-400">TRACK 4: Sw & PAY</div>
                </div>

                <svg
                  width="680"
                  height={trackHeight}
                  className="cursor-crosshair overflow-visible"
                  onMouseLeave={() => setHoveredIndex(null)}
                  onMouseMove={(e) => {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const y = e.clientY - rect.top;
                    const ratio = clamp(y / trackHeight, 0, 1);
                    const index = Math.min(computedLogs.length - 1, Math.floor(ratio * computedLogs.length));
                    setHoveredIndex(index);
                  }}
                >
                  {/* Depth Grid Lines */}
                  {Array.from({ length: 9 }).map((_, idx) => {
                    const depthVal = minDepth + ((maxDepth - minDepth) / 10) * (idx + 1);
                    const y = depthToY(depthVal);
                    return (
                      <g key={idx}>
                        <line x1="0" y1={y} x2="680" y2={y} stroke={themeStyles.gridLine} strokeDasharray="3 3" />
                        <text x="2" y={y - 4} fill="#64748b" fontSize="9" fontFamily="monospace">{depthVal.toFixed(0)}m</text>
                      </g>
                    );
                  })}

                  {/* Track 1: GR */}
                  <g transform="translate(50, 0)">
                    <rect width={trackWidth} height={trackHeight} fill="none" stroke="#334155" />
                    <path
                      d={computedLogs.map((d, i) => `${i === 0 ? 'M' : 'L'} ${clamp((d.gr / 150) * trackWidth, 0, trackWidth)} ${depthToY(d.depth)}`).join(' ')}
                      fill="none"
                      stroke="#34d399"
                      strokeWidth="1.5"
                    />
                  </g>

                  {/* Track 2: Resistivity (Logarithmic) */}
                  <g transform="translate(200, 0)">
                    <rect width={trackWidth} height={trackHeight} fill="none" stroke="#334155" />
                    <path
                      d={computedLogs.map((d, i) => {
                        const logVal = Math.log10(clamp(d.res, 0.2, 2000));
                        const x = ((logVal - Math.log10(0.2)) / (Math.log10(2000) - Math.log10(0.2))) * trackWidth;
                        return `${i === 0 ? 'M' : 'L'} ${x} ${depthToY(d.depth)}`;
                      }).join(' ')}
                      fill="none"
                      stroke="#fb923c"
                      strokeWidth="1.5"
                    />
                  </g>

                  {/* Track 3: NPHI / RHOB */}
                  <g transform="translate(350, 0)">
                    <rect width={trackWidth} height={trackHeight} fill="none" stroke="#334155" />
                    {computedLogs.map((d, i) => {
                      if (i === computedLogs.length - 1) return null;
                      const xRhob = clamp(((d.rhob - 1.95) / (2.95 - 1.95)) * trackWidth, 0, trackWidth);
                      const xNphi = clamp(((0.45 - d.nphi) / 0.45) * trackWidth, 0, trackWidth);
                      if (xNphi > xRhob) {
                        return (
                          <polygon
                            key={i}
                            points={`${xRhob},${depthToY(d.depth)} ${xNphi},${depthToY(d.depth)} ${xNphi},${depthToY(computedLogs[i+1].depth)} ${xRhob},${depthToY(computedLogs[i+1].depth)}`}
                            fill="#facc15"
                            fillOpacity="0.35"
                          />
                        );
                      }
                      return null;
                    })}
                    <path
                      d={computedLogs.map((d, i) => `${i === 0 ? 'M' : 'L'} ${clamp(((d.rhob - 1.95) / 1.0) * trackWidth, 0, trackWidth)} ${depthToY(d.depth)}`).join(' ')}
                      fill="none"
                      stroke="#f87171"
                      strokeWidth="1.5"
                    />
                    <path
                      d={computedLogs.map((d, i) => `${i === 0 ? 'M' : 'L'} ${clamp(((0.45 - d.nphi) / 0.45) * trackWidth, 0, trackWidth)} ${depthToY(d.depth)}`).join(' ')}
                      fill="none"
                      stroke="#38bdf8"
                      strokeDasharray="3 2"
                      strokeWidth="1.5"
                    />
                  </g>

                  {/* Track 4: Sw & Pay Flag */}
                  <g transform="translate(500, 0)">
                    <rect width={trackWidth + 20} height={trackHeight} fill="none" stroke="#334155" />
                    <path
                      d={computedLogs.map((d, i) => `${i === 0 ? 'M' : 'L'} ${clamp(d.sw * trackWidth, 0, trackWidth)} ${depthToY(d.depth)}`).join(' ')}
                      fill="none"
                      stroke="#38bdf8"
                      strokeWidth="1.5"
                    />
                    {computedLogs.map((d, i) => d.isPay && (
                      <rect key={i} x={trackWidth + 4} y={depthToY(d.depth)} width={12} height={Math.max(2, trackHeight / computedLogs.length)} fill="#10b981" />
                    ))}
                  </g>

                  {/* Cursor Line */}
                  {hoveredIndex !== null && computedLogs[hoveredIndex] && (
                    <g>
                      <line
                        x1="0"
                        y1={depthToY(computedLogs[hoveredIndex].depth)}
                        x2="680"
                        y2={depthToY(computedLogs[hoveredIndex].depth)}
                        stroke={themeStyles.accentTrack}
                        strokeWidth="1.5"
                        strokeDasharray="4 2"
                      />
                      <rect
                        x="0"
                        y={depthToY(computedLogs[hoveredIndex].depth) - 10}
                        width="48"
                        height="20"
                        fill="#0284c7"
                        rx="3"
                      />
                      <text
                        x="4"
                        y={depthToY(computedLogs[hoveredIndex].depth) + 4}
                        fill="#ffffff"
                        fontSize="10"
                        fontWeight="bold"
                        fontFamily="monospace"
                      >
                        {computedLogs[hoveredIndex].depth.toFixed(1)}m
                      </text>
                    </g>
                  )}
                </svg>
              </div>
            </div>
          </div>

          {/* MODAL 1: ADD SINGLE CUSTOM POINT */}
          {showAddPointModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className={`${themeStyles.cardBg} border ${themeStyles.border} rounded-xl p-6 max-w-md w-full shadow-2xl`}>
                <h3 className="text-base font-bold mb-4 font-mono text-emerald-400 flex items-center gap-2">
                  <IconPlus className="h-5 w-5" /> Insert Custom Depth Point
                </h3>

                <form onSubmit={handleAddPoint} className="space-y-3 font-mono text-xs">
                  <div>
                    <label className={themeStyles.subText}>Measured Depth (m)</label>
                    <input
                      type="number"
                      step="0.1"
                      required
                      value={customPoint.depth}
                      onChange={(e) => setCustomPoint({ ...customPoint, depth: parseFloat(e.target.value) })}
                      className={`w-full mt-1 p-2 rounded border ${themeStyles.inputBg}`}
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={themeStyles.subText}>Gamma Ray (0-300 API)</label>
                      <input
                        type="number"
                        step="0.5"
                        required
                        value={customPoint.gr}
                        onChange={(e) => setCustomPoint({ ...customPoint, gr: parseFloat(e.target.value) })}
                        className={`w-full mt-1 p-2 rounded border ${themeStyles.inputBg}`}
                      />
                    </div>
                    <div>
                      <label className={themeStyles.subText}>Resistivity (0.1-5000 Ω·m)</label>
                      <input
                        type="number"
                        step="0.5"
                        required
                        value={customPoint.res}
                        onChange={(e) => setCustomPoint({ ...customPoint, res: parseFloat(e.target.value) })}
                        className={`w-full mt-1 p-2 rounded border ${themeStyles.inputBg}`}
                      />
                    </div>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className={themeStyles.subText}>RHOB (1.0-3.5 g/cc)</label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        value={customPoint.rhob}
                        onChange={(e) => setCustomPoint({ ...customPoint, rhob: parseFloat(e.target.value) })}
                        className={`w-full mt-1 p-2 rounded border ${themeStyles.inputBg}`}
                      />
                    </div>
                    <div>
                      <label className={themeStyles.subText}>NPHI (-0.05 to 0.60 dec)</label>
                      <input
                        type="number"
                        step="0.01"
                        required
                        value={customPoint.nphi}
                        onChange={(e) => setCustomPoint({ ...customPoint, nphi: parseFloat(e.target.value) })}
                        className={`w-full mt-1 p-2 rounded border ${themeStyles.inputBg}`}
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-2 pt-4">
                    <button
                      type="button"
                      onClick={() => setShowAddPointModal(false)}
                      className="px-4 py-2 rounded bg-slate-800 text-slate-300 hover:bg-slate-700"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 rounded bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold"
                    >
                      Save & Recompute
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 2: ADVANCED BULK / SPREADSHEET EDITOR */}
          {showManualEditor && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className={`${themeStyles.cardBg} border ${themeStyles.border} rounded-xl p-6 max-w-2xl w-full shadow-2xl flex flex-col max-h-[90vh]`}>
                <div className="flex justify-between items-center mb-3">
                  <h3 className="text-base font-bold font-mono text-cyan-400 flex items-center gap-2">
                    <IconCode className="h-5 w-5" /> Advanced Raw Well Data Editor
                  </h3>
                  <span className="text-[11px] font-mono text-slate-400">Supports Tab or CSV</span>
                </div>

                <p className={`text-xs ${themeStyles.subText} mb-2`}>
                  Paste or edit continuous log rows. Format: <code className="text-cyan-300 font-mono">Depth GR Res RHOB NPHI CALI</code>. Out-of-range values are automatically clamped.
                </p>

                <textarea
                  value={manualText}
                  onChange={(e) => setManualText(e.target.value)}
                  className={`w-full flex-1 min-h-[300px] p-3 rounded font-mono text-xs border ${themeStyles.inputBg} focus:outline-none focus:border-cyan-400 whitespace-pre`}
                  spellCheck="false"
                />

                <div className="flex justify-between items-center gap-2 pt-4">
                  <span className="text-[10px] text-slate-500 font-mono">
                    {manualText.split('\n').filter(Boolean).length} rows ready
                  </span>
                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowManualEditor(false)}
                      className="px-4 py-2 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-mono"
                    >
                      Cancel
                    </button>
                    <button
                      type="button"
                      onClick={handleApplyManualData}
                      className="px-4 py-2 rounded bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs font-mono"
                    >
                      Apply & Run Pipeline
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
